<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>Atmos Auto — Servisna knjižica</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1a2b">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--acc:#1686b8;--bg:#0b1220;--bg2:#101a2c;--card:#152238;--card2:#1b2b46;--line:rgba(255,255,255,.1);--txt:#f2f6fb;--muted:#9fb0c6;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--r:16px;--nav:64px}
:root[data-theme=light]{--bg:#eef2f7;--bg2:#e6ecf4;--card:#fff;--card2:#f3f6fa;--line:rgba(10,30,60,.12);--txt:#14202f;--muted:#5d6f86;--ok:#059669;--warn:#b45309;--bad:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:calc(var(--nav) + 90px + env(safe-area-inset-bottom))}
body.fs-l{font-size:112%}body.fs-s{font-size:92%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 14px;font-size:.9rem}
button:active{transform:scale(.98)}
.btn-p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn-d{background:rgba(248,113,113,.15);color:var(--bad);border-color:rgba(248,113,113,.4)}
.btn-s{padding:6px 10px;font-size:.8rem;border-radius:10px}
.fld{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:1rem}
.fld:focus{outline:2px solid var(--acc);outline-offset:-1px}
select.fld option{color:#000}
label.l{display:block;font-size:.72rem;color:var(--muted);margin:0 0 4px 2px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.top-in{max-width:1100px;margin:auto;display:flex;gap:8px;align-items:center}
.logo{font-weight:800;letter-spacing:.5px;font-size:1rem;white-space:nowrap}.logo b{color:var(--acc)}
.top select{flex:1;min-width:0;padding:8px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.shell{max-width:1100px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero{background:linear-gradient(135deg,var(--acc),#0b3b57);color:#fff;border:0}
.hero .n{font-size:1.4rem;font-weight:800}.hero .p{opacity:.85;font-size:.9rem}
.hero .odo{font-size:2rem;font-weight:800;margin-top:6px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat small{color:var(--muted);font-size:.72rem;display:block}.stat b{font-size:1.15rem;display:block;margin-top:2px}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:.8rem}
.item{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:8px}
.item .ic{font-size:1.4rem;width:34px;text-align:center}
.item .t{font-weight:600;word-break:break-word}
.item .amt{font-weight:700;white-space:nowrap;text-align:right}
.acts{display:flex;gap:6px;margin-top:8px}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:.72rem;font-weight:700}
.b-ok{background:rgba(52,211,153,.18);color:var(--ok)}.b-warn{background:rgba(251,191,36,.2);color:var(--warn)}.b-bad{background:rgba(248,113,113,.2);color:var(--bad)}.b-n{background:var(--card2);color:var(--muted)}
.alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:.9rem}
.alert.bad{background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.4)}.alert.warn{background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.4)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.chart{display:flex;gap:8px;align-items:flex-end;height:150px;padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar{width:100%;max-width:38px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden;min-height:2px}
.bar i{display:block}.c1{background:var(--acc)}.c2{background:#f59e0b}.c3{background:#10b981}
.col small{font-size:.65rem;color:var(--muted);margin-top:4px}
.legend{display:flex;gap:12px;font-size:.72rem;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.legend .a:before{background:var(--acc)}.legend .b:before{background:#f59e0b}.legend .c:before{background:#10b981}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg2);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;border-radius:0;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;color:var(--muted);height:var(--nav)}
nav button span{font-size:1.3rem}nav button.on{color:var(--acc);font-weight:700}
nav .sec{display:none}
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));z-index:25;width:58px;height:58px;border-radius:50%;background:var(--acc);border:0;color:#fff;font-size:2rem;line-height:1;box-shadow:0 6px 20px rgba(0,0,0,.4);padding:0}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--txt);width:min(520px,calc(100% - 20px));max-height:92vh;padding:0;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{padding:16px}.dlg h3{margin:0 0 12px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 90px);transform:translateX(-50%);background:#111c;backdrop-filter:blur(8px);color:#fff;padding:10px 16px;border-radius:12px;z-index:50;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:36px;height:36px;border-radius:50%;padding:0;border:3px solid transparent}.sw button.on{border-color:var(--txt)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px}.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.more{display:grid;gap:10px}.more button{display:flex;align-items:center;gap:12px;padding:16px;text-align:left;font-size:1rem}
footer{text-align:center;color:var(--muted);font-size:.75rem;padding:16px}
@media(max-width:560px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}.logo small{display:none}}
@media(min-width:900px){
 body{padding-bottom:30px;padding-left:200px}
 nav{top:0;bottom:auto;width:200px;right:auto;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:70px 8px 8px}
 nav button{flex:none;flex-direction:row;height:46px;font-size:.95rem;gap:12px;padding:0 14px;justify-content:flex-start;border-radius:12px}
 nav .sec{display:flex}nav .morebtn{display:none}
 .top{margin-left:-200px;padding-left:212px;position:sticky}.top-in{max-width:1100px}
 .fab{bottom:24px;right:24px}.toast{bottom:30px}
}
@media print{
 nav,.fab,.top,.noprint,.acts,footer{display:none!important}
 body{background:#fff;color:#000;padding:0}.card,.item,.stat{background:#fff;color:#000;border-color:#bbb}.muted{color:#444}
 :root{--txt:#000;--muted:#444;--card:#fff;--card2:#eee}
}
</style>
</head>
<body>

<div class="top"><div class="top-in">
  <div class="logo">ATMOS<b>AUTO</b></div>
  <select id="vehSel" aria-label="Vozilo"></select>
  <button id="addVehBtn" title="Novo vozilo">＋🚗</button>
</div></div>

<main class="shell" id="view"></main>
<footer>zeljkoracunariborca</footer>

<button class="fab" id="fab" aria-label="Dodaj">+</button>

<nav id="nav">
  <button data-tab="pregled"><span>🏠</span>Pregled</button>
  <button data-tab="servisi"><span>🛠️</span>Servisi</button>
  <button data-tab="gorivo"><span>⛽</span>Gorivo</button>
  <button data-tab="putovanja"><span>🗺️</span>Putovanja</button>
  <button data-tab="podsetnici" class="sec"><span>🔔</span>Podsetnici</button>
  <button data-tab="vozilo" class="sec"><span>📋</span>Vozilo</button>
  <button data-tab="podesavanja" class="sec"><span>⚙️</span>Podešavanja</button>
  <button data-tab="vise" class="morebtn"><span>☰</span>Više</button>
</nav>

<dialog id="dlg"><form class="dlg" id="dlgForm" method="dialog"></form></dialog>
<div class="toast" id="toast"></div>
<input type="file" id="impFile" accept=".json,application/json" hidden>

<script>
'use strict';
const $=id=>document.getElementById(id);
const KEY='atmosAuto2', OLD='atmosAutoDb';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dayDiff=s=>Math.round((new Date(s+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/864e5);
const CATS=['Ulje i filteri','Kočnice','Gume','Motor','Menjač / kvačilo','Elektrika','Karoserija','Klima','Registracija / tehnički','Ostalo'];
const CAT_IC={'Ulje i filteri':'🛢️','Kočnice':'🛑','Gume':'🛞','Motor':'⚙️','Menjač / kvačilo':'🕹️','Elektrika':'🔋','Karoserija':'🚘','Klima':'❄️','Registracija / tehnički':'📄','Ostalo':'🔧'};
const ACCS=['#1686b8','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#64748b'];

/* ---------- PODACI ---------- */
function newVeh(name){return{id:uid(),name:name||'Moj automobil',plate:'',year:'',vin:'',fuelType:'Dizel',
  spec:{engine:'',tires:'',oil:'',insurance:'',notes:''},
  planer:{regDate:'',asstDate:'',insDate:'',maliKm:'',velikiKm:''},
  records:[],fuels:[],trips:[],reminders:[]}}
function migrate(o){
  const v=newVeh(o.model||'Moj automobil');
  v.plate=o.plate||'';
  v.spec=Object.assign(v.spec,o.spec||{});
  v.planer=Object.assign(v.planer,o.planer||{});
  v.records=(o.records||[]).map(r=>({id:r.id||uid(),date:r.date,km:num(r.km)||'',cat:'Ostalo',title:r.title||'',cost:num(r.cost),mech:r.mech||'',note:r.note||''}));
  v.fuels=(o.fuels||[]).map(f=>({id:f.id||uid(),date:f.date,km:num(f.km),liters:num(f.liters),cost:num(f.cost),full:true,station:''}));
  v.trips=(o.trips||[]).map(t=>({id:t.id||uid(),date:t.date,route:t.route||'',type:t.type||'Trošak',amount:num(String(t.cost).replace(/[^\d.,]/g,'')),cur:/eur|€/i.test(t.cost)?'EUR':'RSD',note:String(t.cost||'')}));
  return v;
}
function fresh(){const v=newVeh();return{v:2,settings:{theme:'dark',accent:ACCS[0],cur:'RSD',eurRate:117.2,unit:'l100',warnDays:30,warnKm:1500,fs:'m',notif:false,lastNotif:'',backupDays:7,lastExport:'',snapKeep:7,fileSync:false},vehicles:[v],active:v.id}}
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.vehicles&&r.vehicles.length){r.settings=Object.assign(fresh().settings,r.settings);return r}}catch{}
  const d=fresh();
  try{const o=JSON.parse(localStorage.getItem(OLD));if(o&&(o.records||o.fuels||o.model||o.trips)){d.vehicles=[migrate(o)];d.active=d.vehicles[0].id;setTimeout(()=>toast('Stari podaci su preneti ✔'),600)}}catch{}
  return d;
}
let db=load();
const S=()=>db.settings;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{toast('Greška pri čuvanju (memorija puna?)')}scheduleFileWrite();scheduleAlertSync()};

/* ---------- OBAVEŠTENJA U POZADINI ---------- */
let alertTimer=null;
function scheduleAlertSync(){clearTimeout(alertTimer);alertTimer=setTimeout(syncAlertData,800)}
async function syncAlertData(){
  try{
    const items=[];
    db.vehicles.forEach(v=>{
      const p=v.planer||{},cur=maxKm(v),nm=v.name;
      [['Registracija',p.regDate],['Pomoć na putu',p.asstDate],['Putno zdravstveno',p.insDate]].forEach(([l,d])=>d&&items.push({v:nm,label:l,date:d}));
      [['Mali servis',p.maliKm],['Veliki servis',p.velikiKm]].forEach(([l,k])=>k&&items.push({v:nm,label:l,km:num(k),cur}));
      (v.reminders||[]).forEach(r=>{if(!r.done&&(r.date||r.km))items.push({v:nm,label:r.title,date:r.date||'',km:r.km?num(r.km):0,cur})});
    });
    await idbSet('alerts',{warnDays:num(S().warnDays),warnKm:num(S().warnKm),enabled:!!S().notif,items});
  }catch{}
}
function updateBadge(){
  try{
    if(!navigator.setAppBadge)return;
    const n=db.vehicles.reduce((s,v)=>s+allReminders(v).filter(a=>a.lvl==='bad'||a.lvl==='warn').length,0);
    n?navigator.setAppBadge(n):navigator.clearAppBadge();
  }catch{}
}
async function regPeriodic(){
  try{
    const r=await navigator.serviceWorker.ready;
    if(!r.periodicSync)return false;
    await r.periodicSync.register('atmos-check',{minInterval:12*3600*1000});return true;
  }catch{return false}
}
async function testNotif(){
  if(!('Notification' in window)){toast('Pregledač ne podržava obaveštenja');return}
  let p=Notification.permission;if(p!=='granted')p=await Notification.requestPermission();
  if(p!=='granted'){toast('Dozvola za obaveštenja nije data');return}
  try{const r=await navigator.serviceWorker?.getRegistration();
    if(r)await r.showNotification('Atmos Auto',{body:'Probno obaveštenje radi ✔',icon:'icon.png'});else new Notification('Atmos Auto',{body:'Probno obaveštenje radi ✔',icon:'icon.png'});
  }catch{toast('Obaveštenje nije moguće prikazati')}
}

/* ---------- REZERVNE KOPIJE ---------- */
const SNAP='atmosAuto2_snaps';
const getSnaps=()=>{try{return JSON.parse(localStorage.getItem(SNAP))||[]}catch{return[]}};
function hasData(d){return d.vehicles.some(v=>v.records.length||v.fuels.length||v.trips.length||v.reminders.length||v.plate||v.spec.notes)}
function takeSnap(reason,force){
  try{
    if(!hasData(db))return;
    const arr=getSnaps(),day=todayStr();
    if(!force&&arr.length&&arr[0].day===day)return;
    arr.unshift({t:new Date().toISOString(),day,reason:reason||'auto',data:JSON.stringify(db)});
    const keep=Math.max(1,Math.min(20,num(S().snapKeep)||7));
    while(arr.length>keep)arr.pop();
    try{localStorage.setItem(SNAP,JSON.stringify(arr))}catch{ // nema mesta: ostavi samo najnoviju
      arr.length=1;try{localStorage.setItem(SNAP,JSON.stringify(arr))}catch{}}
  }catch{}
}
function restoreSnap(i){
  const s=getSnaps()[i];if(!s)return;
  if(!confirm('Vratiti podatke iz kopije od '+new Date(s.t).toLocaleString('sr-RS')+'? Trenutno stanje se prvo sačuva kao nova kopija.'))return;
  takeSnap('pre-vraćanja',true);
  const arr=getSnaps();const src=arr.find(x=>x.t===s.t)||s;
  db=JSON.parse(src.data);db.settings=Object.assign(fresh().settings,db.settings);
  save();go('pregled');toast('Podaci vraćeni ✔');
}
function daysSinceExport(){const e=S().lastExport;return e?-dayDiff(e):null}
function backupDue(){
  const n=num(S().backupDays);if(!n||!hasData(db))return false;
  const d=daysSinceExport();return d===null||d>=n;
}
/* automatsko upisivanje u fajl (File System Access API — Chrome/Edge) */
const FS_OK='showSaveFilePicker' in window;
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('atmosAutoFS',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbSet=async(k,v)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('h','readwrite');t.objectStore('h').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const idbGet=async k=>{const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('h').objectStore('h').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
let fileHandle=null,fileState='off',fileTimer=null,fileErr='';
async function fileInit(){
  if(!FS_OK||!S().fileSync)return;
  try{fileHandle=await idbGet('handle');
    if(!fileHandle){fileState='off';return}
    const p=await fileHandle.queryPermission({mode:'readwrite'});
    fileState=p==='granted'?'on':'paused';
    if(fileState==='on')writeFile();
  }catch(e){fileState='off'}
}
async function pickFile(){
  try{
    const h=await showSaveFilePicker({suggestedName:'atmos_auto_automatski_backup.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});
    fileHandle=h;await idbSet('handle',h);S().fileSync=true;fileState='on';
    save();await writeFile();render();toast('Automatsko čuvanje uključeno ✔');
  }catch(e){if(e.name!=='AbortError')toast('Nije moguće izabrati fajl')}
}
async function resumeFile(){
  try{
    const p=await fileHandle.requestPermission({mode:'readwrite'});
    fileState=p==='granted'?'on':'paused';
    if(fileState==='on'){await writeFile();toast('Automatsko čuvanje nastavljeno ✔')}
    render();
  }catch{toast('Dozvola nije data')}
}
async function stopFile(){S().fileSync=false;fileState='off';fileHandle=null;try{await idbSet('handle',null)}catch{}save();render()}
function scheduleFileWrite(){
  if(fileState!=='on'||!fileHandle)return;
  clearTimeout(fileTimer);fileTimer=setTimeout(writeFile,1500);
}
async function writeFile(){
  if(!fileHandle)return;
  try{
    const w=await fileHandle.createWritable();
    await w.write(JSON.stringify(db,null,2));await w.close();
    S().lastExport=todayStr();S().lastFileWrite=new Date().toISOString();
    try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}
    fileErr='';
  }catch(e){fileState='paused';fileErr=e.message||'greška'}
}
const V=()=>db.vehicles.find(v=>v.id===db.active)||db.vehicles[0];

/* ---------- POMOĆNE ---------- */
const fmtDate=s=>{if(!s)return'—';const p=s.split('-');return p.length===3?`${p[2]}.${p[1]}.${p[0]}.`:s};
const money=(n,cur)=>Math.round(n).toLocaleString('sr-RS')+' '+(cur||S().cur);
const toBase=(a,c)=>c==='EUR'?a*S().eurRate:a;
const kmFmt=n=>Math.round(n).toLocaleString('sr-RS')+' km';
const maxKm=v=>Math.max(0,...v.records.map(r=>num(r.km)),...v.fuels.map(f=>num(f.km)));
function consFmt(l100){if(!l100)return'—';return S().unit==='l100'?l100.toFixed(1)+' L/100km':(100/l100).toFixed(1)+' km/L'}
function fuelCalc(v){
  const f=[...v.fuels].sort((a,b)=>num(a.km)-num(b.km)||String(a.date).localeCompare(b.date));
  const per={};let last=null,acc=0,tl=0,td=0;
  f.forEach(x=>{const km=num(x.km),l=num(x.liters);
    if(last===null){if(x.full!==false){last=km;acc=0}return}
    acc+=l;
    if(x.full!==false){const d=km-last;if(d>0){per[x.id]=acc/d*100;tl+=acc;td+=d}last=km;acc=0}
  });
  let cpk=0;
  if(f.length>1){const d=num(f[f.length-1].km)-num(f[0].km);const c=f.slice(1).reduce((s,x)=>s+num(x.cost),0);if(d>0)cpk=c/d}
  const tL=v.fuels.reduce((s,x)=>s+num(x.liters),0),tC=v.fuels.reduce((s,x)=>s+num(x.cost),0);
  return{per,avg:td?tl/td*100:0,cpk,ppl:tL?tC/tL:0,totalCost:tC}
}
const totals=v=>({
  service:v.records.reduce((s,r)=>s+num(r.cost),0),
  fuel:v.fuels.reduce((s,f)=>s+num(f.cost),0),
  trips:v.trips.reduce((s,t)=>s+toBase(num(t.amount),t.cur),0)});
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}

function dateStat(s,label){
  if(!s)return null;const d=dayDiff(s),w=S().warnDays;
  if(d<0)return{lvl:'bad',text:`${label}: isteklo pre ${-d} d`,badge:`Isteklo pre ${-d} d`};
  if(d<=w)return{lvl:'warn',text:`${label}: ističe za ${d} d (${fmtDate(s)})`,badge:`Za ${d} d`};
  return{lvl:'ok',text:`${label}: važi još ${d} d`,badge:`Važi još ${d} d`}
}
function kmStat(target,label,cur){
  if(!target||!cur)return null;const r=num(target)-cur;
  if(r<=0)return{lvl:'bad',text:`${label}: prekoračeno ${kmFmt(-r)}`,badge:`Prekoračeno ${kmFmt(-r)}`};
  if(r<=S().warnKm)return{lvl:'warn',text:`${label}: još ${kmFmt(r)}`,badge:`Još ${kmFmt(r)}`};
  return{lvl:'ok',text:`${label}: još ${kmFmt(r)}`,badge:`Još ${kmFmt(r)}`}
}
function allReminders(v){
  const p=v.planer||{},km=maxKm(v),out=[];
  const add=(x,extra)=>{if(x)out.push(Object.assign(x,extra||{}))};
  add(dateStat(p.regDate,'Registracija'),{ic:'📄',src:'planer'});
  add(dateStat(p.asstDate,'Pomoć na putu'),{ic:'🆘',src:'planer'});
  add(dateStat(p.insDate,'Putno zdravstveno'),{ic:'🏥',src:'planer'});
  add(kmStat(p.maliKm,'Mali servis',km),{ic:'🛢️',src:'planer'});
  add(kmStat(p.velikiKm,'Veliki servis',km),{ic:'🔧',src:'planer'});
  (v.reminders||[]).forEach(r=>{
    if(r.done)return;
    const a=r.date?dateStat(r.date,r.title):null,b=r.km?kmStat(r.km,r.title,km):null;
    const worst=[a,b].filter(Boolean).sort((x,y)=>({bad:0,warn:1,ok:2}[x.lvl]-{bad:0,warn:1,ok:2}[y.lvl]))[0];
    if(worst)out.push(Object.assign({},worst,{ic:'🔔',src:'custom',id:r.id}));
    else out.push({lvl:'n',text:r.title,badge:'Na listi',ic:'📝',src:'custom',id:r.id});
  });
  return out;
}
const lvlOrder={bad:0,warn:1,ok:2,n:3};

function applyTheme(){
  const s=S();let t=s.theme;
  if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  document.documentElement.dataset.theme=t;
  document.documentElement.style.setProperty('--acc',s.accent);
  document.body.className=s.fs==='l'?'fs-l':s.fs==='s'?'fs-s':'';
  document.querySelector('meta[name=theme-color]').content=t==='light'?'#eef2f7':'#0b1220';
}

function pgPregled(){

    <div class="grid g2" style="margin-bottom:10px">
      <div><label class="l">Podsetnik za izvoz</label><select class="fld" data-cfg="backupDays" data-n="1">${[[0,'Isključen'],[1,'Svaki dan'],[7,'Jednom nedeljno'],[14,'Na 2 nedelje'],[30,'Jednom mesečno']].map(([k,l])=>`<option value="${k}" ${num(s.backupDays)===k?'selected':''}>${l}</option>`).join('')}</select></div>
      <div><label class="l">Interne kopije (čuva se)</label><select class="fld" data-cfg="snapKeep" data-n="1">${[3,5,7,10,20].map(k=>`<option value="${k}" ${num(s.snapKeep)===k?'selected':''}>${k}</option>`).join('')}</select></div>
    </div>
    <div class="small muted" style="margin-bottom:10px">Poslednji izvoz: ${s.lastExport?fmtDate(s.lastExport)+' (pre '+daysSinceExport()+' d)':'nikad'}. Aplikacija sama pravi interne kopije jednom dnevno i pre brisanja ili uvoza.</div>
    ${(()=>{const sn=getSnaps();return sn.length?`<label class="l">Interne kopije</label>${sn.map((x,i)=>`<div class="row sp small" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${new Date(x.t).toLocaleString('sr-RS',{dateStyle:'short',timeStyle:'short'})} <span class="muted">· ${esc(x.reason)}</span></span><button class="btn-s" data-act="restore" data-i="${i}">Vrati</button></div>`).join('')}<div style="height:10px"></div>`:'<div class="small muted" style="margin-bottom:10px">Još nema internih kopija.</div>'})()}
    <label class="l">Automatsko čuvanje u fajl</label>
    ${FS_OK?(S().fileSync&&fileHandle?`<div class="small" style="margin-bottom:8px">${fileState==='on'?'✅ Aktivno — fajl <b>'+esc(fileHandle.name)+'</b> se ažurira posle svake izmene.':'⏸️ Pauzirano'+(fileErr?' ('+esc(fileErr)+')':'')+' — dodirni da nastaviš.'}</div><div class="row">${fileState!=='on'?'<button class="btn-p grow" data-act="fileresume">▶ Nastavi</button>':''}<button class="grow" data-act="filepick">📁 Drugi fajl</button><button class="btn-d grow" data-act="filestop">Isključi</button></div>`:`<div class="small muted" style="margin-bottom:8px">Izaberi fajl (npr. u Google Drive ili Dropbox folderu) koji će aplikacija sama ažurirati.</div><button class="btn-p" style="width:100%" data-act="filepick">📁 Izaberi fajl</button>`):'<div class="small muted">Ovaj pregledač ne podržava automatsko upisivanje u fajl (radi u Chrome/Edge na računaru i delimično na Androidu). Koristi podsetnik i interne kopije.</div>'}
  </div>
  <div class="card"><h3>💾 Podaci</h3>
    <div class="grid g2" style="margin-bottom:8px">
      <button data-act="export">⬇ Izvezi (JSON)</button>
      <button data-act="import">⬆ Uvezi</button>
      <button data-act="csv">📑 Izvezi CSV (Excel)</button>
      <button onclick="window.print()">🖨️ Štampaj</button>
    </div>
    <div class="small muted" style="margin-bottom:10px">Podaci se čuvaju samo na ovom uređaju. Redovno napravi rezervnu kopiju (izvoz) i sačuvaj je na sigurno mesto.</div>
    <button class="btn-d" data-act="reset" style="width:100%">⚠️ Obriši sve podatke</button>
  </div>`;
}

function pgVise(){
  return`<div class="more">
    <button data-tab="podsetnici" onclick="go('podsetnici')"><span style="font-size:1.6rem">🔔</span><div><b>Podsetnici</b><div class="small muted">Registracija, osiguranje, servisni rokovi</div></div></button>
    <button onclick="go('vozilo')"><span style="font-size:1.6rem">📋</span><div><b>Vozilo i dokumenta</b><div class="small muted">Podaci o vozilu, specifikacije, beleške</div></div></button>
    <button onclick="go('podesavanja')"><span style="font-size:1.6rem">⚙️</span><div><b>Podešavanja</b><div class="small muted">Tema, valuta, izvoz / uvoz podataka</div></div></button>
  </div>`;
}

/* ---------- FORME ---------- */
const FORMS={
  servis:{title:'Servis',list:'records',f:[
    {k:'date',l:'Datum',t:'date',d:todayStr,h:1},{k:'km',l:'Kilometraža',t:'number',h:1,d:()=>maxKm(V())||''},
    {k:'cat',l:'Kategorija',t:'select',o:CATS,d:()=>'Ulje i filteri'},
    {k:'title',l:'Intervencija / deo',t:'text',req:1,ph:'Mali servis (ulje i filteri)'},
    {k:'cost',l:'Cena ('+'RSD)',t:'number',h:1,d:()=>''},{k:'mech',l:'Majstor / lokacija',t:'text',h:1},
    {k:'note',l:'Beleške i delovi',t:'textarea',ph:'Kataloški brojevi...'}]},
  gorivo:{title:'Sipanje goriva',list:'fuels',f:[
    {k:'date',l:'Datum',t:'date',d:todayStr,h:1},{k:'km',l:'Kilometraža',t:'number',req:1,h:1,d:()=>maxKm(V())||''},
    {k:'liters',l:'Litara',t:'number',req:1,h:1,step:'0.01'},{k:'cost',l:'Ukupno cena',t:'number',h:1},
    {k:'station',l:'Pumpa (opciono)',t:'text'},
    {k:'full',l:'Napunjen pun rezervoar',t:'check',d:()=>true}]},
  putovanje:{title:'Putni trošak',list:'trips',f:[
    {k:'date',l:'Datum',t:'date',d:todayStr,h:1},{k:'route',l:'Relacija / opis',t:'text',req:1,h:1,ph:'Beograd — Koper'},
    {k:'type',l:'Vrsta troška',t:'select',o:['Putarina','Vinjeta','Parking','Kazna','Pranje','Smeštaj','Ostalo'],d:()=>'Putarina',h:1},
    {k:'amount',l:'Iznos',t:'number',h:1,step:'0.01'},{k:'cur',l:'Valuta',t:'select',o:['RSD','EUR'],d:()=>S().cur,h:1},
    {k:'note',l:'Beleška',t:'text'}]},
  podsetnik:{title:'Podsetnik',list:'reminders',f:[
    {k:'title',l:'Naziv',t:'text',req:1,ph:'Zamena guma, tehnički pregled...'},
    {k:'date',l:'Datum (opciono)',t:'date',h:1},{k:'km',l:'Kilometraža (opciono)',t:'number',h:1},
    {k:'note',l:'Beleška',t:'text'}]}
};
let editing=null;
function openForm(type,id){
  const F=FORMS[type],v=V();const item=id?v[F.list].find(x=>x.id===id):null;
  editing={type,id};
  const fld=x=>{
    let val=item?item[x.k]:(x.d?x.d():'');
    if(val==null)val='';
    let el;
    if(x.t==='select')el=`<select class="fld" name="${x.k}">${x.o.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select>`;
    else if(x.t==='textarea')el=`<textarea class="fld" name="${x.k}" rows="2" placeholder="${esc(x.ph||'')}">${esc(val)}</textarea>`;
    else if(x.t==='check')return`<label class="row" style="margin:8px 0;grid-column:1/-1"><input type="checkbox" name="${x.k}" ${val!==false?'checked':''} style="width:20px;height:20px"> ${x.l}</label>`;
    else el=`<input class="fld" name="${x.k}" type="${x.t}" ${x.t==='number'?`inputmode="decimal" step="${x.step||'any'}"`:''} value="${esc(val)}" placeholder="${esc(x.ph||'')}" ${x.req?'required':''}>`;
    return`<div style="${x.h?'':'grid-column:1/-1'}"><label class="l">${x.l}${x.req?' *':''}</label>${el}</div>`;
  };
  $('dlgForm').innerHTML=`<h3>${item?'Izmena':'Novi unos'} — ${F.title}</h3>
   <div class="grid g2" style="gap:10px">${F.f.map(fld).join('')}</div>
   <div class="row" style="margin-top:14px"><button type="button" class="grow" id="dlgCancel">Otkaži</button><button type="submit" class="btn-p grow">💾 Sačuvaj</button></div>`;
  $('dlg').showModal();
}
$('dlgForm').addEventListener('submit',e=>{
  e.preventDefault();
  const {type,id}=editing,F=FORMS[type],v=V(),fd=new FormData($('dlgForm')),o={};
  F.f.forEach(x=>{
    if(x.t==='check')o[x.k]=$('dlgForm').elements[x.k].checked;
    else{const val=fd.get(x.k);o[x.k]=(x.t==='number'&&val!=='')?num(val):(val||'')}
  });
  if(type==='gorivo'&&(!o.km||!o.liters)){toast('Unesi kilometražu i litre');return}
  if(!o.date&&F.f.some(x=>x.k==='date')&&type!=='podsetnik')o.date=todayStr();
  if(id){Object.assign(v[F.list].find(x=>x.id===id),o)}
  else{o.id=uid();if(type==='podsetnik')o.done=false;v[F.list].push(o)}
  save();$('dlg').close();render();toast('Sačuvano ✔');
});
document.addEventListener('click',e=>{if(e.target.id==='dlgCancel')$('dlg').close()});

/* ---------- AKCIJE ---------- */
function download(name,text,mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportCsv(){
  const v=V(),rows=[['Tip','Datum','Km','Opis','Kategorija / Vrsta','Litara','Iznos','Valuta','Beleška']];
  v.records.forEach(r=>rows.push(['Servis',r.date,r.km,r.title,r.cat,'',r.cost,S().cur,[r.mech,r.note].filter(Boolean).join(' — ')]));
  v.fuels.forEach(r=>rows.push(['Gorivo',r.date,r.km,r.station||'Gorivo','',r.liters,r.cost,S().cur,r.full===false?'delimično':'']));
  v.trips.forEach(r=>rows.push(['Putovanje',r.date,'',r.route,r.type,'',r.amount,r.cur,r.note]));
  rows.sort((a,b)=>a===rows[0]?-1:b===rows[0]?1:String(b[1]).localeCompare(String(a[1])));
  const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
  download(`atmos_auto_${v.plate||v.name}.csv`,csv,'text/csv');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-tab],[data-set]');if(!b)return;
  const d=b.dataset;
  if(d.set){S()[d.set]=d.val;save();render();return}
  if(d.tab&&!d.act&&b.closest('#nav')){go(d.tab);return}
  const v=V();
  switch(d.act){
    case'add':openForm(d.t);break;
    case'edit':openForm(d.t,d.id);break;
    case'del':{const F=FORMS[d.t];if(confirm('Obrisati ovaj zapis?')){v[F.list]=v[F.list].filter(x=>x.id!==d.id);save();render();toast('Obrisano')}break}
    case'rdone':{const r=v.reminders.find(x=>x.id===d.id);if(r){r.done=true;save();render();toast('Označeno kao završeno')}break}
    case'delveh':{
      if(db.vehicles.length<2){toast('Mora ostati bar jedno vozilo');break}
      if(confirm(`Obrisati vozilo "${v.name}" sa svim podacima?`)){db.vehicles=db.vehicles.filter(x=>x.id!==v.id);db.active=db.vehicles[0].id;save();go('pregled')}break}
    case'export':S().lastExport=todayStr();save();download(`atmos_auto_backup_${todayStr()}.json`,JSON.stringify(db,null,2),'application/json');toast('Rezervna kopija preuzeta');render();break;
    case'snooze':{const n=num(S().backupDays)||7;const d=new Date();d.setDate(d.getDate()-n+1);S().lastExport=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());save();render();toast('Podsetiću te sutra');break}
    case'restore':restoreSnap(+d.i);break;
    case'testnotif':testNotif();break;
    case'filepick':pickFile();break;
    case'fileresume':resumeFile();break;
    case'filestop':stopFile();break;
    case'csv':exportCsv();break;
    case'import':$('impFile').click();break;
    case'reset':if(confirm('Obrisati SVE podatke? Ovo se može poništiti samo iz interne kopije.')&&confirm('Sigurno? Preporuka: prvo napravi izvoz.')){takeSnap('pre-brisanja',true);localStorage.removeItem(KEY);localStorage.removeItem(OLD);db=fresh();save();go('pregled')}break;
  }
});
$('fab').onclick=()=>openForm({servisi:'servis',gorivo:'gorivo',putovanja:'putovanje',podsetnici:'podsetnik'}[ui.tab]);

/* automatsko čuvanje polja */
document.addEventListener('change',e=>{
  const el=e.target,d=el.dataset,v=V();
  if(el.id==='vehSel'){db.active=el.value;save();render();return}
  if(el.id==='catF'){ui.cat=el.value;render();return}
  if(d.v!==undefined){v[d.v]=el.value;save();if(d.v==='name'||d.v==='plate')renderHeaderOnly()}
  else if(d.s!==undefined){v.spec[d.s]=el.value;save()}
  else if(d.p!==undefined){v.planer[d.p]=el.value;save();render()}
  else if(d.cfg!==undefined){const val=(el.type==='number'||d.n)?num(el.value):el.value;S()[d.cfg]=val;save();render()}
});
function renderHeaderOnly(){const sel=$('vehSel'),v=V(),o=[...sel.options].find(x=>x.value===v.id);if(o)o.textContent=v.name+(v.plate?' · '+v.plate:'')}
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ui.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('q');q.focus();q.setSelectionRange(pos,pos)}
});
$('addVehBtn').onclick=()=>{
  const n=prompt('Naziv novog vozila:','Novi automobil');if(!n)return;
  const v=newVeh(n.trim());db.vehicles.push(v);db.active=v.id;save();go('vozilo');toast('Vozilo dodato');
};
$('impFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const p=JSON.parse(ev.target.result);
      if(p&&p.v===2&&p.vehicles){
        if(confirm('Uvoz zamenjuje SVE trenutne podatke. Nastaviti?')){takeSnap('pre-uvoza',true);db=p;db.settings=Object.assign(fresh().settings,db.settings);save();go('pregled');toast('Podaci uvezeni ✔')}
      }else if(p&&(p.records||p.fuels||p.trips||p.model)){
        if(confirm('Prepoznat je stari format. Dodati kao novo vozilo?')){const v=migrate(p);db.vehicles.push(v);db.active=v.id;save();go('pregled');toast('Uvezeno kao novo vozilo ✔')}
      }else toast('Nepoznat format fajla');
    }catch{toast('Greška pri čitanju fajla')}
    e.target.value='';
  };
  r.readAsText(f);
};

/* obaveštenja */
document.addEventListener('click',async e=>{
  if(e.target.id!=='notifBtn')return;
  if(S().notif){S().notif=false;save();render();return}
  if(!('Notification' in window)){toast('Pregledač ne podržava obaveštenja');return}
  const p=await Notification.requestPermission();
  if(p==='granted'){S().notif=true;save();render();toast('Obaveštenja uključena');checkNotif(true);regPeriodic()}else toast('Dozvola odbijena');
});
function checkNotif(force){
  if(!S().notif||!('Notification' in window)||Notification.permission!=='granted')return;
  if(!force&&S().lastNotif===todayStr())return;
  const al=db.vehicles.flatMap(v=>allReminders(v).filter(a=>a.lvl==='bad'||a.lvl==='warn').map(a=>`${v.name}: ${a.text}`));
  if(!al.length)return;
  S().lastNotif=todayStr();save();
  const body=al.slice(0,4).join('\n');
  navigator.serviceWorker?.getRegistration().then(r=>r?r.showNotification('Atmos Auto — podsetnik',{body,icon:'icon.png'}):new Notification('Atmos Auto — podsetnik',{body,icon:'icon.png'})).catch(()=>{});
}

/* PWA */
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>S().theme==='auto'&&applyTheme());
let wasWide=innerWidth>=900;
addEventListener('resize',()=>{const w=innerWidth>=900;if(w!==wasWide){wasWide=w;render()}});

takeSnap('automatski');
render();
fileInit().then(()=>{if(ui.tab==='podesavanja')render()});
setTimeout(()=>checkNotif(),1200);
syncAlertData();
if(S().notif)regPeriodic();
</script>
</body>
